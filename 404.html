<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&display=swap">
<style>
:root { color-scheme: dark; --hi: #3d5246; --mid: #263329; --lo: #121a15; --ink: #f1ede1; --soft: #b9bfae; --brass: #e2be78; }
html, body { height: 100%; margin: 0; }
body {
  background: radial-gradient(110% 85% at 50% 40%, var(--hi), var(--mid) 48%, var(--lo));
  color: var(--ink); font-family: "Michroma", "Eurostile", Arial, sans-serif;
  display: grid; place-items: center; text-align: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
p.code { color: var(--brass); font-size: 11px; letter-spacing: 0.1em; margin: 0 0 16px; }
h1 { font-weight: 400; font-size: clamp(22px, 4vw, 34px); margin: 0 0 14px; }
p { color: var(--soft); font-size: 12px; line-height: 1.8; max-width: 42ch; margin: 0 auto 28px; }
a { color: var(--lo); background: var(--brass); text-decoration: none; font-size: 11px; letter-spacing: 0.08em; padding: 12px 18px; display: inline-block; }
a:hover { background: var(--ink); }
a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="code">GREŠKA 404</p>
  <h1>Ovaj dio nije u mehanizmu</h1>
  <p>Stranica koju tražiš ne postoji ili je premještena. Sat te čeka na početnoj stranici.</p>

</main>
</body>
